<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="900" height="560" rx="14" fill="#0a0c11"/>
