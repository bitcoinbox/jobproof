name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + hermetic tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests (hermetic — no network, no API key)
        run: pytest -m "not embeddings" -q

  retrieval-gate:
    name: retrieval quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the sample-corpus index
        run: python -m src.cli index sample-corpus --index-path .chroma
      - name: Gate on retrieval quality (fails the build on regression)
        run: python -m src.cli eval --retrieval-only --gate
